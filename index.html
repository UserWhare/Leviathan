<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0f14">
  <meta name="description" content="Leviathan é um CTF web interativo executado inteiramente no navegador.">
  <title>Leviathan CTF</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="https://i.imgur.com/WhCWd2W.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="shell" aria-label="Terminal Leviathan CTF">
    <header class="topbar">
      <div class="brand">
        <img class="brand-logo" src="https://i.imgur.com/WhCWd2W.png" alt="Leviathan logo">
        <div>
          <strong>LEVIATHAN</strong>
          <span>terminal ctf</span>
        </div>
      </div>

      <div class="status" aria-live="polite">
        <span id="target-status">alvo: --</span>
        <span id="flag-status">flags: 0/4</span>
      </div>
    </header>

    <section id="terminal" class="terminal" role="log" aria-live="polite" aria-label="Saída do terminal"></section>

    <form id="input-line" class="input-line" autocomplete="off">
      <label id="prompt" for="cmdline"></label>
      <input id="cmdline" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" autofocus aria-label="Comando">
    </form>
  </main>

  <script src="script.js" defer></script>
</body>
</html>
